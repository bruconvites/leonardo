<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite - Leonardo 4 anos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
  }
  .screen.active { display: block; }

  .img-screen {
    background-size: cover;
    background-position: center;
    cursor: pointer;
  }

  #screen-1 { background-image: url('primeira.jpg'); }

  #screen-video {
    background: #000;
  }
  #screen-video video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  #screen-interativo { background-image: url('interativo.jpg'); }
  #screen-presentes { background-image: url('presentes.jpg'); }

  /* Zonas clicaveis invisiveis */
  .hit {
    position: absolute;
    background: transparent;
    cursor: pointer;
  }

  /* ---- Zonas na tela interativo.jpg ---- */
  #screen-interativo .btn-voltar-video {
    top: 2.5%; left: 22%; width: 56%; height: 6%;
  }
  #screen-interativo .btn-ver-rota {
    top: 76%; left: 2%; width: 30%; height: 17%;
  }
  #screen-interativo .btn-confirmar {
    top: 76%; left: 35%; width: 30%; height: 17%;
  }
  #screen-interativo .btn-presente {
    top: 76%; left: 68%; width: 30%; height: 17%;
  }

  /* ---- Zona na tela presentes.jpg ---- */
  #screen-presentes .btn-voltar-convite {
    top: 2%; left: 25%; width: 50%; height: 6%;
  }

  /* Sparkle dourado */
  .sparkle {
    position: fixed;
    pointer-events: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6d0 0%, #ffd966 45%, rgba(255,217,102,0) 75%);
    box-shadow: 0 0 6px 1px rgba(255, 217, 102, 0.8);
    z-index: 9999;
    animation: sparkle-anim 0.9s ease-out forwards;
  }
  @keyframes sparkle-anim {
    0% {
      transform: translate(0, 0) scale(0.3) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(180deg);
      opacity: 0;
    }
  }

  .hint {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

  <!-- Tela 1: primeira.jpg -->
  <div id="screen-1" class="screen img-screen active"></div>

  <!-- Tela vídeo -->
  <div id="screen-video" class="screen">
    <video id="main-video" src="video.mp4" playsinline></video>
  </div>

  <!-- Tela interativo.jpg -->
  <div id="screen-interativo" class="screen img-screen">
    <div class="hit btn-voltar-video" title="Voltar ao vídeo"></div>
    <div class="hit btn-ver-rota" title="Ver rota"></div>
    <div class="hit btn-confirmar" title="Confirmar presença"></div>
    <div class="hit btn-presente" title="Sugestão de presente"></div>
  </div>

  <!-- Tela presentes.jpg -->
  <div id="screen-presentes" class="screen img-screen">
    <div class="hit btn-voltar-convite" title="Voltar ao convite"></div>
  </div>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function playVideo() {
    showScreen('screen-video');
    const video = document.getElementById('main-video');
    video.currentTime = 0;
    video.play().catch(() => {});
  }

  // Tela 1 -> clique em qualquer lugar abre o vídeo
  document.getElementById('screen-1').addEventListener('click', function(e){
    spawnSparkles(e.clientX, e.clientY);
    playVideo();
  });

  // Ao fim do vídeo -> interativo.jpg
  document.getElementById('main-video').addEventListener('ended', function(){
    showScreen('screen-interativo');
  });

  // Também permite pular o vídeo tocando nele
  document.getElementById('main-video').addEventListener('click', function(e){
    spawnSparkles(e.clientX, e.clientY);
  });

  // Botões da tela interativo.jpg
  document.querySelector('#screen-interativo .btn-voltar-video').addEventListener('click', function(e){
    e.stopPropagation();
    spawnSparkles(e.clientX, e.clientY);
    playVideo();
  });

  document.querySelector('#screen-interativo .btn-ver-rota').addEventListener('click', function(e){
    e.stopPropagation();
    spawnSparkles(e.clientX, e.clientY);
    window.open('https://maps.app.goo.gl/VYWYeT3QcW9Cby1p6', '_blank');
  });

  document.querySelector('#screen-interativo .btn-confirmar').addEventListener('click', function(e){
    e.stopPropagation();
    spawnSparkles(e.clientX, e.clientY);
    window.open('https://wa.link/ow5e1n', '_blank');
  });

  document.querySelector('#screen-interativo .btn-presente').addEventListener('click', function(e){
    e.stopPropagation();
    spawnSparkles(e.clientX, e.clientY);
    showScreen('screen-presentes');
  });

  // Botão da tela presentes.jpg
  document.querySelector('#screen-presentes .btn-voltar-convite').addEventListener('click', function(e){
    e.stopPropagation();
    spawnSparkles(e.clientX, e.clientY);
    showScreen('screen-interativo');
  });

  // Efeito de brilho dourado em qualquer clique da tela
  document.addEventListener('click', function(e){
    spawnSparkles(e.clientX, e.clientY);
  });

  function spawnSparkles(x, y) {
    const count = 10;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 50;
      s.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      s.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }
</script>

</body>
</html>
